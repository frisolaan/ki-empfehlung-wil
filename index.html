<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Empfehlung Wil · PICTS</title>
<style>
:root{
  --ink:#1a1a1a; --muted:#5f5f5a; --line:#e2e0d8; --line2:#cfcdc3; --bg:#f4f3ee; --card:#fff;
  --sus:#2f8f5b; --lp:#2f6cae; --komp:#c2772e; --bedarf:#9a3b3b; --park:#8a4b8f;
  --sus-bg:#eef7f1; --lp-bg:#eaf1f9; --komp-bg:#fbf1e4; --bedarf-bg:#f8ebeb; --park-bg:#f4ecf5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;}
button{font-family:inherit;cursor:pointer;}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:20;flex-wrap:wrap;}
.brand strong{font-size:18px;display:block;}
.brand .sub{font-size:12.5px;color:var(--muted);}
.tabs{display:flex;gap:6px;}
.tab{border:1px solid var(--line2);background:#f6f5f1;border-radius:999px;padding:7px 16px;font-size:14px;color:var(--muted);}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.cyclebar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;}
.cyclebar .lbl{font-size:13px;color:var(--muted);font-weight:600;}
.cyclepick{display:flex;gap:6px;flex-wrap:wrap;}
.cyclepick button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 14px;font-size:14px;}
.cyclepick button.sel{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);}

main{max-width:1080px;margin:0 auto;padding:18px 20px 80px;}

/* Board (Erfassen) */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.board.extra{grid-template-columns:repeat(2,1fr);margin-top:14px;}
.fieldcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:16px 16px 14px;cursor:pointer;transition:box-shadow .12s;}
.fieldcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
.fieldcard h3{margin:0 0 4px;font-size:16px;color:var(--c);}
.fieldcard .lf{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px;min-height:32px;}
.fieldcard .count{font-size:12.5px;color:var(--muted);}
.fieldcard .count b{color:var(--ink);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;}

/* Zoom (detail) */
.detail{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:0;overflow:hidden;}
.detailhead{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--c-bg);}
.detailhead h2{margin:0;font-size:20px;color:var(--c);flex:1;}
.detailhead .lf{font-size:13px;color:var(--muted);font-style:italic;}
.back{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;}
.qblock{padding:16px 20px;border-top:1px solid var(--line);}
.qblock .qtyp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c);}
.qblock .qtext{font-size:17px;font-weight:600;margin:3px 0 10px;}
.entries{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.entry{background:var(--c-bg);border-radius:9px;padding:9px 12px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;}
.entry .txt{flex:1;}
.entry .ind{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;}
.entry .src{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.src.geerntet{background:#e7e6e0;color:#555;}
.src.ergaenzt{background:#d8eef4;color:#1d6d85;}
.entry .del{border:none;background:none;color:#b24;font-size:16px;line-height:1;padding:0 2px;cursor:pointer;opacity:.5;}
.entry .del:hover{opacity:1;}

.addform{display:flex;flex-direction:column;gap:8px;background:#faf9f6;border:1px dashed var(--line2);border-radius:10px;padding:12px;}
.addform textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font:inherit;font-size:15px;resize:vertical;min-height:44px;}
.addform .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.srctoggle{display:flex;gap:4px;}
.srctoggle button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:6px 11px;font-size:13px;color:var(--muted);}
.srctoggle button.on{background:var(--c);color:#fff;border-color:var(--c);}
.addbtn{margin-left:auto;background:var(--c);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;}
.hint{font-size:12px;color:var(--muted);}

/* Fazit */
.fazitpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.fazitpick button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:9px 16px;font-size:14px;color:var(--c);border-bottom:3px solid var(--c);}
.fazitpick button.sel{background:var(--c);color:#fff;}
.fazitrow{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;}
.fazitrow .rtyp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c);background:var(--c-bg);padding:8px 16px;}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
.col{background:#fff;padding:10px 12px;min-height:40px;}
.col h5{margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.col .ce{font-size:13.5px;margin-bottom:5px;padding-bottom:5px;border-bottom:1px dotted var(--line);}
.col .ce:last-child{border-bottom:none;}
.col .ce .ci{display:block;font-size:12px;color:var(--muted);}
.konklusio{padding:12px 16px;background:#f3f8f4;border-top:1px solid var(--line);}
.konklusio label{font-size:12px;font-weight:700;color:#2a7347;text-transform:uppercase;letter-spacing:.05em;}
.konklusio .exist{font-size:14.5px;margin:6px 0;padding:7px 10px;background:#e3f2e7;border-radius:8px;display:flex;gap:8px;align-items:flex-start;}
.konklusio textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit;font-size:14.5px;margin-top:6px;min-height:40px;}
.konklusio .krow{display:flex;gap:8px;margin-top:6px;align-items:center;}
.konklusio .ksave{background:#2a7347;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:600;}
.pool{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:14px 18px;}
.pool h3{margin:0 0 8px;color:var(--c);font-size:16px;}
.pool .pe{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;}
.pool .pe:last-child{border:none;}
.pool .pz{font-size:11px;color:var(--muted);white-space:nowrap;}

/* Konsens-Übersicht (Fazit) */
.konspanel{background:var(--card);border:1px solid var(--line2);border-left:4px solid #2a7347;border-radius:12px;padding:14px 18px;margin-bottom:18px;}
.konshead{display:flex;align-items:baseline;gap:10px;}
.konshead strong{font-size:15px;}
.konscount{font-size:12px;color:var(--muted);}
.konssub{font-size:12.5px;color:var(--muted);margin:3px 0 10px;}
.konsrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);}
.konsrow:first-of-type{border-top:none;}
.konstag{flex:0 0 auto;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:center;}
.konstag.gem{background:#e3f2e7;color:#2a7347;}
.konstag.spez{background:#eef0f9;color:#3a4a9a;}
.konstext{flex:1;font-size:14.5px;}
.konsrow .del{border:none;background:none;color:#b24;font-size:18px;line-height:1;cursor:pointer;opacity:.6;padding:0 4px;align-self:center;}
.konsrow .del:hover{opacity:1;}

/* Ebene-Wahl in Konklusio-Box */
.levelpick{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.levelpick button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);}
.levelpick button.sel{background:#2a7347;color:#fff;border-color:#2a7347;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading{text-align:center;color:var(--muted);padding:40px;}

@media(max-width:800px){
  .board,.board.extra,.cols{grid-template-columns:1fr;}
  .detailhead{flex-wrap:wrap;}
}

.vpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
.vpick .vlbl{font-size:13px;color:var(--muted);font-weight:600;margin-right:4px;}
.vpick button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;}
.vpick button.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
.vhint{font-size:13px;color:var(--muted);margin:4px 0 14px;line-height:1.5;}
.vstmt{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.vstmt .vmeta{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c);}
.vstmt .vsatz{font-size:15px;font-weight:600;margin:3px 0 4px;}
.vstmt .vind{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;}
.vtoggle{display:flex;gap:4px;}
.vtoggle button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:6px 12px;font-size:13px;color:var(--muted);}
.vtoggle button.ja.on{background:#2a7347;color:#fff;border-color:#2a7347;}
.vtoggle button.nein.on{background:#a3302f;color:#fff;border-color:#a3302f;}
.vdone{font-size:12px;color:#2a7347;font-weight:600;}
.vstmt textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;margin-top:8px;min-height:36px;resize:vertical;}
.vsave{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:7px 15px;font-size:13px;font-weight:600;margin-left:auto;}
.vsection{margin:20px 0 8px;font-size:16px;font-weight:600;}
.bedarf{background:var(--bedarf-bg);border:1px solid var(--bedarf);border-radius:10px;padding:12px 14px;}
.bedarf .be{font-size:14px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.06);display:flex;gap:8px;align-items:flex-start;}
.bedarf .be:last-of-type{border:none;}
.bedarf textarea{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;margin-top:8px;min-height:38px;resize:vertical;}
.bedarf .badd{background:var(--bedarf);color:#fff;border:none;border-radius:8px;padding:7px 15px;font-size:13px;font-weight:600;margin-top:8px;}

</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>KI-Empfehlung Stadt Wil</strong>
      <span class="sub">PICTS-Treffen · gemeinsamer Nenner pro Zyklus</span>
    </div>
    <nav class="tabs">
      <button id="tab-erfassen" class="tab active" onclick="setMode('erfassen')">Erfassen</button>
      <button id="tab-fazit" class="tab" onclick="setMode('fazit')">Fazit</button>
      <button id="tab-vern" class="tab" onclick="setMode('vernehmlassung')">Vernehmlassung</button>
    </nav>
  </header>

  <div id="bar-erfassen" class="cyclebar">
    <span class="lbl">Zyklus:</span>
    <div class="cyclepick" id="cyclepick"></div>
    <span class="status" id="status"></span>
  </div>

  <main id="app"></main>

  <div id="toast" class="toast"></div>

  <script>
/* KI-Empfehlung Wil — Front-End
   Konfiguration (Fragen-Wortlaut) steht ganz oben und ist frei editierbar. */

const CYCLES = ["Zyklus 1", "Zyklus 2", "Zyklus 3"];

const FIELDS = {
  "SuS": {
    title: "KI-Einsatz von Schülerinnen und Schülern",
    color: "sus",
    leitfrage: "Wann, wie, unter welchen Bedingungen? In welche Arbeitsphasen im Lernprozess?",
    indikator: true,
    fragen: [
      { typ: "Fundament", text: "Was soll ein Kind am Ende dieses Zyklus bewusst ohne KI können?" },
      { typ: "Erlaubnis", text: "Wofür dürfen SuS KI ausdrücklich nutzen? Woran erkennt man die Grenze?" },
      { typ: "Grenze", text: "Wovor warnen wir – und was gilt bei Missbrauch/Täuschung?" }
    ]
  },
  "LP": {
    title: "KI-Einsatz von Lehrpersonen",
    color: "lp",
    leitfrage: "Wann, wie, unter welchen Bedingungen? Konkrete Beispiele. (Indikator optional)",
    indikator: false,
    fragen: [
      { typ: "Entlastung", text: "Wo nimmt KI uns Arbeit ab, ohne dass die Qualität leidet?" },
      { typ: "Vorbild", text: "Was von unserem KI-Einsatz machen wir den SuS sichtbar?" },
      { typ: "Voraussetzung", text: "Was müssen wir selbst können, bevor wir es von den SuS verlangen?" }
    ]
  },
  "Kompetenzen": {
    title: "Welche Kompetenzen aufbauen (genKI)?",
    color: "komp",
    leitfrage: "Welche Kompetenzen wollen wir bei SuS (und LuL) aufbauen? (Indikator zentral)",
    indikator: true,
    fragen: [
      { typ: "Kern", text: "Die eine Kompetenz, die jedes Kind dieses Zyklus mitnimmt?" },
      { typ: "Operationalisierung", text: "Woran erkennen wir, dass ein Kind KI nutzt statt genutzt zu werden?" },
      { typ: "Selbstbezug", text: "Was davon gilt genauso für uns LuL?" }
    ]
  }
};

const EXTRA = {
  "Bedarf SL": { title: "Bedarf an die Schulführung", color: "bedarf",
    leitfrage: "Was brauchen wir von der SL, damit Feld 1–3 umsetzbar ist? (Zugang, Tool, WB-Zeit, Datenschutz, Eltern)" },
  "Parkplatz": { title: "Parkplatz", color: "park",
    leitfrage: "Offene Fragen und Anliegen zum Thema KI." }
};

const HOUSES = [
  { name: "OS LiHo", cycles: ["Zyklus 3"] },
  { name: "OS Sonnenhof", cycles: ["Zyklus 3"] },
  { name: "OS Bronschhofen", cycles: ["Zyklus 3"] },
  { name: "PS Tonhalle", cycles: ["Zyklus 1", "Zyklus 2"] },
  { name: "PS Kirchplatz", cycles: ["Zyklus 1", "Zyklus 2"] },
  { name: "PS Matt", cycles: ["Zyklus 1", "Zyklus 2"] },
  { name: "PS Bronschhofen", cycles: ["Zyklus 1", "Zyklus 2"] },
  { name: "PS Rossrüti", cycles: ["Zyklus 1", "Zyklus 2"] },
  { name: "PS LiHo", cycles: ["Zyklus 1", "Zyklus 2"] },
  { name: "PS Allee", cycles: ["Zyklus 1", "Zyklus 2"] }
];

let MODE = "erfassen";
let CYCLE = CYCLES[0];
let OPEN_FIELD = null;      // Erfassen: welches Feld gezoomt
let FAZIT_FIELD = "SuS";    // Fazit: welches Feld
let DATA = [];              // alle Einträge (Tabelle Einträge)
let VHOUSE = null, VCYCLE = null;   // Vernehmlassung: Schulhaus + Zyklus
let FEEDBACK = [], FEEDBACK_LOADED = false;

function captureFocus() { const a = document.activeElement; if (a && a.dataset && a.dataset.key) return { key: a.dataset.key, val: a.value, s: a.selectionStart, e: a.selectionEnd }; return null; }
function restoreFocus(f) { if (!f) return; const n = document.querySelector('[data-key="' + (window.CSS && CSS.escape ? CSS.escape(f.key) : f.key) + '"]'); if (n) { n.value = f.val; n.focus(); try { n.setSelectionRange(f.s, f.e); } catch (_) {} } }

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadData() {
  try {
    const r = await fetch("/api/data?op=results");
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Fehler");
    DATA = j.records || [];
  } catch (e) {
    toast("Laden fehlgeschlagen: " + e.message);
    DATA = [];
  }
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function setMode(m) {
  MODE = m; OPEN_FIELD = null;
  $("#tab-erfassen").classList.toggle("active", m === "erfassen");
  $("#tab-fazit").classList.toggle("active", m === "fazit");
  $("#tab-vern").classList.toggle("active", m === "vernehmlassung");
  $("#bar-erfassen").style.display = m === "erfassen" ? "flex" : "none";
  render();
}

function setCycle(c) { CYCLE = c; OPEN_FIELD = null; render(); }

function renderCyclebar() {
  const p = $("#cyclepick"); p.innerHTML = "";
  CYCLES.forEach(c => {
    const b = el("button", c === CYCLE ? "sel" : "", c);
    b.onclick = () => setCycle(c);
    p.appendChild(b);
  });
  const n = DATA.filter(d => d.Zyklus === CYCLE && d.Ebene !== "gemeinsam").length;
  $("#status").textContent = n + " Einträge in " + CYCLE;
}

function entriesFor(feld, fragetyp, zyklus) {
  return DATA.filter(d => d.Feld === feld && d.Ebene !== "gemeinsam"
    && (fragetyp == null || d.Fragetyp === fragetyp)
    && (zyklus == null || d.Zyklus === zyklus));
}

/* ---------- ERFASSEN ---------- */
function renderErfassen() {
  const app = $("#app"); app.innerHTML = "";
  if (OPEN_FIELD) { renderDetail(app, OPEN_FIELD); return; }

  const board = el("div", "board");
  Object.keys(FIELDS).forEach(key => {
    const f = FIELDS[key];
    const card = el("div", "fieldcard");
    card.style.setProperty("--c", `var(--${f.color})`);
    const cnt = entriesFor(key, null, CYCLE).length;
    card.innerHTML = `<h3>${esc(f.title)}</h3><div class="lf">${esc(f.leitfrage)}</div>
      <div class="count"><span class="dot"></span><b>${cnt}</b> Einträge in ${CYCLE}</div>`;
    card.onclick = () => { OPEN_FIELD = key; render(); };
    board.appendChild(card);
  });
  app.appendChild(board);

  const extra = el("div", "board extra");
  Object.keys(EXTRA).forEach(key => {
    const f = EXTRA[key];
    const card = el("div", "fieldcard");
    card.style.setProperty("--c", `var(--${f.color})`);
    const cnt = entriesFor(key, null, CYCLE).length;
    card.innerHTML = `<h3>${esc(f.title)}</h3><div class="lf">${esc(f.leitfrage)}</div>
      <div class="count"><span class="dot"></span><b>${cnt}</b> Einträge in ${CYCLE}</div>`;
    card.onclick = () => { OPEN_FIELD = key; render(); };
    extra.appendChild(card);
  });
  app.appendChild(extra);
}

function renderDetail(app, key) {
  const isExtra = !!EXTRA[key];
  const f = isExtra ? EXTRA[key] : FIELDS[key];
  const wrap = el("div", "detail");
  wrap.style.setProperty("--c", `var(--${f.color})`);
  wrap.style.setProperty("--c-bg", `var(--${f.color}-bg)`);

  const head = el("div", "detailhead");
  head.innerHTML = `<h2>${esc(f.title)}</h2><span class="lf">${esc(f.leitfrage)}</span>`;
  const back = el("button", "back", "← Übersicht");
  back.onclick = () => { OPEN_FIELD = null; render(); };
  head.appendChild(back);
  wrap.appendChild(head);

  const fragen = isExtra
    ? [{ typ: "—", text: f.leitfrage }]
    : f.fragen.concat([{ typ: "Weiterer Punkt", text: "Was noch? (passt in keine der Fragen oben)" }]);

  const showInd = isExtra ? false : f.indikator;
  fragen.forEach(q => wrap.appendChild(qBlock(key, f, q, showInd)));
  app.appendChild(wrap);
}

function qBlock(key, f, q, showInd) {
  const block = el("div", "qblock");
  if (!(q.typ === "—")) block.appendChild(el("div", "qtyp", esc(q.typ)));
  block.appendChild(el("div", "qtext", esc(q.text)));

  const list = el("div", "entries");
  const items = entriesFor(key, q.typ, CYCLE);
  items.forEach(it => list.appendChild(entryRow(it)));
  block.appendChild(list);

  // Add-Formular
  const form = el("div", "addform");
  const ta = el("textarea"); ta.placeholder = "Aussage eintippen…";
  form.appendChild(ta);
  let indTa = null;
  if (showInd) {
    indTa = el("textarea"); indTa.placeholder = "Indikator (optional): woran erkennbar? « … erkennbar daran, dass … »";
    indTa.style.minHeight = "38px"; indTa.style.fontSize = "14px";
    form.appendChild(indTa);
  }
  const row = el("div", "row");
  let quelle = "geerntet";
  const tgl = el("div", "srctoggle");
  ["geerntet", "ergänzt"].forEach(s => {
    const b = el("button", s === quelle ? "on" : "", s);
    b.onclick = () => { quelle = s; [...tgl.children].forEach((c, i) => c.classList.toggle("on", ["geerntet", "ergänzt"][i] === s)); };
    tgl.appendChild(b);
  });
  row.appendChild(el("span", "hint", "Quelle:"));
  row.appendChild(tgl);
  const add = el("button", "addbtn", "+ Hinzufügen");
  add.onclick = async () => {
    const aussage = ta.value.trim();
    if (!aussage) { toast("Bitte eine Aussage eintippen."); return; }
    add.disabled = true;
    await addEntry({
      Zyklus: CYCLE, Feld: key, Fragetyp: q.typ, Aussage: aussage,
      Indikator: indTa ? indTa.value.trim() : "", Quelle: quelle, Ebene: "Rohdaten"
    });
    add.disabled = false;
  };
  row.appendChild(add);
  form.appendChild(row);
  block.appendChild(form);
  return block;
}

function entryRow(it) {
  const e = el("div", "entry");
  const srcCls = it.Quelle === "ergänzt" ? "ergaenzt" : "geerntet";
  e.innerHTML = `<span class="txt">${esc(it.Aussage)}${it.Indikator ? `<span class="ind">→ ${esc(it.Indikator)}</span>` : ""}</span>
    <span class="src ${srcCls}">${esc(it.Quelle || "")}</span>`;
  const del = el("button", "del", "×");
  del.title = "Löschen";
  del.onclick = async (ev) => { ev.stopPropagation(); if (confirm("Diesen Eintrag löschen?")) await delEntry(it.id); };
  e.appendChild(del);
  return e;
}

/* ---------- FAZIT ---------- */
function renderFazit() {
  const app = $("#app"); app.innerHTML = "";
  const pick = el("div", "fazitpick");
  Object.keys(FIELDS).concat(Object.keys(EXTRA)).forEach(key => {
    const f = FIELDS[key] || EXTRA[key];
    const b = el("button", key === FAZIT_FIELD ? "sel" : "", esc(key));
    b.style.setProperty("--c", `var(--${f.color})`);
    b.style.setProperty("--c-bg", `var(--${f.color}-bg)`);
    b.onclick = () => { FAZIT_FIELD = key; render(); };
    pick.appendChild(b);
  });
  app.appendChild(pick);

  renderKonsensUebersicht(app);

  if (EXTRA[FAZIT_FIELD]) { renderPool(app, FAZIT_FIELD); return; }

  const f = FIELDS[FAZIT_FIELD];
  const fragen = f.fragen.concat([{ typ: "Weiterer Punkt", text: "" }]);
  fragen.forEach(q => {
    const row = el("div", "fazitrow");
    row.style.setProperty("--c", `var(--${f.color})`);
    row.style.setProperty("--c-bg", `var(--${f.color}-bg)`);
    row.appendChild(el("div", "rtyp", esc(q.typ)));
    const cols = el("div", "cols");
    CYCLES.forEach(cy => {
      const c = el("div", "col");
      c.appendChild(el("h5", null, esc(cy)));
      const items = entriesFor(FAZIT_FIELD, q.typ, cy);
      if (!items.length) c.appendChild(el("div", "ci", "<span style='color:#bbb'>—</span>"));
      items.forEach(it => {
        const ce = el("div", "ce");
        ce.innerHTML = esc(it.Aussage) + (it.Indikator ? `<span class="ci">→ ${esc(it.Indikator)}</span>` : "");
        c.appendChild(ce);
      });
      cols.appendChild(c);
    });
    row.appendChild(cols);
    row.appendChild(konklusioBox(FAZIT_FIELD, q.typ, f.indikator));
    app.appendChild(row);
  });
}

function renderKonsensUebersicht(app) {
  const kons = DATA.filter(d => d.Ebene === "gemeinsam" || d.Ebene === "zyklusspezifisch");
  const box = el("div", "konspanel");
  const head = el("div", "konshead");
  head.appendChild(el("strong", null, "Aktueller Konsens"));
  head.appendChild(el("span", "konscount", kons.length + (kons.length === 1 ? " Satz" : " Sätze")));
  box.appendChild(head);
  box.appendChild(el("div", "konssub", "Alle gespeicherten Konsens-Sätze. Hier löschbar, um sie nach der Vernehmlassung zu überarbeiten."));
  if (!kons.length) {
    box.appendChild(el("div", "konssub", "<span style='color:#bbb'>Noch keine Konsens-Sätze gespeichert.</span>"));
  } else {
    const order = Object.keys(FIELDS).concat(Object.keys(EXTRA));
    kons.sort((a, b) => (order.indexOf(a.Feld) - order.indexOf(b.Feld)) || String(a.Fragetyp).localeCompare(String(b.Fragetyp)));
    kons.forEach(it => {
      const row = el("div", "konsrow");
      const isGem = it.Ebene === "gemeinsam";
      const tagText = esc(it.Feld) + " · " + esc(it.Fragetyp || "") + " · " + (isGem ? "gemeinsam" : esc(it.Zyklus || "zyklusspezifisch"));
      row.appendChild(el("span", "konstag " + (isGem ? "gem" : "spez"), tagText));
      row.appendChild(el("span", "konstext", esc(it.Aussage) + (it.Indikator ? `<span class="ci">→ ${esc(it.Indikator)}</span>` : "")));
      const del = el("button", "del", "×");
      del.title = "Konsens-Satz löschen";
      del.onclick = async () => { if (confirm("Diesen Konsens-Satz löschen? Bereits abgegebene Rückmeldungen dazu bleiben in der Vernehmlassung erhalten.")) await delEntry(it.id); };
      row.appendChild(del);
      box.appendChild(row);
    });
  }
  app.appendChild(box);
}

function konklusioBox(feld, fragetyp, showInd) {
  const box = el("div", "konklusio");
  box.appendChild(el("label", null, "Konklusio — " + esc(fragetyp)));
  const existing = DATA.filter(d => d.Feld === feld && d.Fragetyp === fragetyp && (d.Ebene === "gemeinsam" || d.Ebene === "zyklusspezifisch"));
  existing.forEach(ex => {
    const isGem = ex.Ebene === "gemeinsam";
    const e = el("div", "exist");
    const lvl = isGem ? "gemeinsam" : esc(ex.Zyklus || "zyklusspezifisch");
    e.innerHTML = `<span style="flex:1"><span class="konstag ${isGem ? "gem" : "spez"}" style="margin-right:7px">${lvl}</span>${esc(ex.Aussage)}${ex.Indikator ? `<span class="ci">→ ${esc(ex.Indikator)}</span>` : ""}</span>`;
    const del = el("button", "del", "×");
    del.onclick = async () => { if (confirm("Konklusio löschen?")) await delEntry(ex.id); };
    e.appendChild(del);
    box.appendChild(e);
  });
  const ta = el("textarea"); ta.placeholder = "Konsens-Satz frisch formulieren…";
  box.appendChild(ta);

  // Ebene wählen: gemeinsam (alle Zyklen) oder nur ein Zyklus
  let level = "gemeinsam";
  const lp = el("div", "levelpick");
  const opts = [{ v: "gemeinsam", t: "gemeinsam (alle Zyklen)" }].concat(CYCLES.map(c => ({ v: c, t: "nur " + c })));
  const updateSaveLabel = () => { save.textContent = level === "gemeinsam" ? "Als gemeinsam speichern" : "Für " + level + " speichern"; };
  opts.forEach(o => {
    const b = el("button", o.v === level ? "sel" : "", esc(o.t));
    b.onclick = () => { level = o.v; lp.querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); updateSaveLabel(); };
    lp.appendChild(b);
  });
  box.appendChild(lp);

  const krow = el("div", "krow");
  let indTa = null;
  if (showInd) {
    indTa = el("input"); indTa.placeholder = "Indikator (optional)";
    indTa.style.cssText = "flex:1;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;";
    krow.appendChild(indTa);
  }
  const save = el("button", "ksave", "Als gemeinsam speichern");
  save.onclick = async () => {
    const aussage = ta.value.trim();
    if (!aussage) { toast("Bitte einen Satz formulieren."); return; }
    save.disabled = true;
    const isGem = level === "gemeinsam";
    await addEntry({ Zyklus: isGem ? "Alle (gemeinsam)" : level, Feld: feld, Fragetyp: fragetyp, Aussage: aussage,
      Indikator: indTa ? indTa.value.trim() : "", Quelle: "", Ebene: isGem ? "gemeinsam" : "zyklusspezifisch" });
    save.disabled = false;
  };
  updateSaveLabel();
  krow.appendChild(save);
  box.appendChild(krow);
  return box;
}

function renderPool(app, key) {
  const f = EXTRA[key];
  const pool = el("div", "pool");
  pool.style.setProperty("--c", `var(--${f.color})`);
  pool.appendChild(el("h3", null, esc(f.title) + " — alle Zyklen"));
  const items = DATA.filter(d => d.Feld === key);
  if (!items.length) pool.appendChild(el("div", "hint", "Noch keine Einträge."));
  items.forEach(it => {
    const pe = el("div", "pe");
    pe.innerHTML = `<span style="flex:1">${esc(it.Aussage)}</span><span class="pz">${esc(it.Zyklus || "")}</span>`;
    const del = el("button", "del", "×");
    del.style.cssText = "border:none;background:none;color:#b24;cursor:pointer;";
    del.onclick = async () => { if (confirm("Löschen?")) await delEntry(it.id); };
    pe.appendChild(del);
    pool.appendChild(pe);
  });
  app.appendChild(pool);
}

/* ---------- API ---------- */
async function addEntry(fields) {
  try {
    const r = await fetch("/api/data?op=submit", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(mapOut(fields)) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Fehler");
    await loadData(); render(); toast("Gespeichert.");
  } catch (e) { toast("Speichern fehlgeschlagen: " + e.message); }
}
async function delEntry(id) {
  try {
    const r = await fetch("/api/data?op=delete", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Fehler");
    await loadData(); render(); toast("Gelöscht.");
  } catch (e) { toast("Löschen fehlgeschlagen: " + e.message); }
}
function mapOut(f) {
  return { zyklus: f.Zyklus, feld: f.Feld, fragetyp: f.Fragetyp, aussage: f.Aussage,
    indikator: f.Indikator, quelle: f.Quelle, ebene: f.Ebene };
}

/* ---------- VERNEHMLASSUNG ---------- */
async function loadFeedback() {
  try {
    const r = await fetch("/api/data?op=feedback-results");
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Fehler");
    FEEDBACK = j.records || [];
  } catch (e) { toast("Rückmeldungen laden fehlgeschlagen: " + e.message); FEEDBACK = []; }
  FEEDBACK_LOADED = true; render();
}
function consensusFor(cycle) {
  const gem = DATA.filter(d => d.Ebene === "gemeinsam");
  const spez = DATA.filter(d => d.Ebene === "zyklusspezifisch" && d.Zyklus === cycle);
  const order = Object.keys(FIELDS).concat(Object.keys(EXTRA));
  return gem.concat(spez).sort((a, b) => order.indexOf(a.Feld) - order.indexOf(b.Feld));
}
function renderVernehmlassung() {
  const app = $("#app"); app.innerHTML = "";
  const hp = el("div", "vpick"); hp.appendChild(el("span", "vlbl", "Schulhaus:"));
  HOUSES.forEach(h => {
    const b = el("button", h.name === VHOUSE ? "sel" : "", esc(h.name));
    b.onclick = () => { VHOUSE = h.name; VCYCLE = h.cycles.length === 1 ? h.cycles[0] : null; render(); };
    hp.appendChild(b);
  });
  app.appendChild(hp);
  if (!VHOUSE) { app.appendChild(el("div", "vhint", "Wähle dein Schulhaus, dann den Zyklus.")); return; }
  const house = HOUSES.find(h => h.name === VHOUSE);
  const cp = el("div", "vpick"); cp.appendChild(el("span", "vlbl", "Zyklus:"));
  house.cycles.forEach(cy => {
    const b = el("button", cy === VCYCLE ? "sel" : "", esc(cy));
    b.onclick = () => { VCYCLE = cy; render(); };
    cp.appendChild(b);
  });
  app.appendChild(cp);
  if (!VCYCLE) { app.appendChild(el("div", "vhint", "Wähle den Zyklus.")); return; }
  if (!FEEDBACK_LOADED) { loadFeedback(); app.appendChild(el("div", "loading", "Lädt…")); return; }

  app.appendChild(el("div", "vhint", "Geht die Empfehlung Satz für Satz durch. Pro Satz: einverstanden oder nicht – und bei Bedarf ein Alternativvorschlag. Eure Antworten ändern den Konsens nicht; sie werden separat gesammelt."));

  const stmts = consensusFor(VCYCLE);
  if (!stmts.length) app.appendChild(el("div", "vhint", "Die Konsens-Sätze erscheinen hier, sobald sie am Treffen erfasst und als «gemeinsam» gespeichert sind. Den Team-Bedarf unten könnt ihr schon jetzt festhalten."));
  stmts.forEach(st => {
    const f = FIELDS[st.Feld] || EXTRA[st.Feld] || { color: "lp" };
    const card = el("div", "vstmt"); card.style.setProperty("--c", `var(--${f.color})`);
    card.appendChild(el("div", "vmeta", esc(st.Feld) + " · " + esc(st.Fragetyp || "") + (st.Ebene === "zyklusspezifisch" ? " · " + esc(st.Zyklus) : "")));
    card.appendChild(el("div", "vsatz", esc(st.Aussage)));
    if (st.Indikator) card.appendChild(el("div", "vind", "→ " + esc(st.Indikator)));
    const existing = FEEDBACK.find(d => d.Ref === st.id && d.Schulhaus === VHOUSE && d.Zyklus === VCYCLE);
    let vote = existing ? existing.Zustimmung : null;
    const row = el("div", "vrow");
    const tgl = el("div", "vtoggle");
    const bJa = el("button", "ja" + (vote === "einverstanden" ? " on" : ""), "einverstanden");
    const bNein = el("button", "nein" + (vote === "nicht einverstanden" ? " on" : ""), "nicht einverstanden");
    bJa.onclick = () => { vote = "einverstanden"; bJa.classList.add("on"); bNein.classList.remove("on"); };
    bNein.onclick = () => { vote = "nicht einverstanden"; bNein.classList.add("on"); bJa.classList.remove("on"); };
    tgl.appendChild(bJa); tgl.appendChild(bNein); row.appendChild(tgl);
    if (existing) row.appendChild(el("span", "vdone", "✓ gespeichert"));
    const save = el("button", "vsave", "Speichern");
    row.appendChild(save);
    card.appendChild(row);
    const alt = el("textarea"); alt.placeholder = "Alternativvorschlag (optional)"; alt.dataset.key = "valt:" + st.id;
    if (existing && existing.Alternativtext) alt.value = existing.Alternativtext;
    card.appendChild(alt);
    save.onclick = async () => { if (!vote) { toast("Bitte einverstanden oder nicht wählen."); return; } save.disabled = true; await saveVotum(st, vote, alt.value.trim()); save.disabled = false; };
    app.appendChild(card);
  });

  app.appendChild(el("div", "vsection", "Was braucht euer Team zur Umsetzung?"));
  const bedarf = el("div", "bedarf");
  bedarf.appendChild(el("div", "vhint", "Weiterbildung, Input, Material, Zeit … – alles, was ihr braucht, um die Empfehlung umzusetzen."));
  FEEDBACK.filter(d => d.Feld === "Bedarf Team" && d.Schulhaus === VHOUSE && d.Zyklus === VCYCLE).forEach(b => {
    const be = el("div", "be"); be.innerHTML = `<span style="flex:1">${esc(b.Alternativtext || "")}</span>`;
    const del = el("button", "del", "×"); del.style.cssText = "border:none;background:none;color:#a33;cursor:pointer;font-size:16px;line-height:1;";
    del.onclick = async () => { if (confirm("Bedarf löschen?")) await delFeedback(b.id); };
    be.appendChild(del); bedarf.appendChild(be);
  });
  const bta = el("textarea"); bta.placeholder = "Bedarf eintippen…"; bta.dataset.key = "bedarf-new";
  bedarf.appendChild(bta);
  const badd = el("button", "badd", "+ Bedarf hinzufügen");
  badd.onclick = async () => { const t = bta.value.trim(); if (!t) { toast("Bitte einen Bedarf eintippen."); return; } badd.disabled = true; await addBedarf(t); bta.value = ""; badd.disabled = false; };
  bedarf.appendChild(badd);
  app.appendChild(bedarf);
}
async function saveVotum(st, zustimmung, alternativtext) {
  try {
    const r = await fetch("/api/data?op=feedback", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ art: "votum", ref: st.id, feld: st.Feld, fragetyp: st.Fragetyp, satz: st.Aussage, schulhaus: VHOUSE, zyklus: VCYCLE, zustimmung, alternativtext }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "Fehler");
    await loadFeedback(); toast("Gespeichert.");
  } catch (e) { toast("Speichern fehlgeschlagen: " + e.message); }
}
async function addBedarf(text) {
  try {
    const r = await fetch("/api/data?op=feedback", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ art: "bedarf", schulhaus: VHOUSE, zyklus: VCYCLE, alternativtext: text }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "Fehler");
    await loadFeedback(); toast("Bedarf gespeichert.");
  } catch (e) { toast("Speichern fehlgeschlagen: " + e.message); }
}
async function delFeedback(id) {
  try {
    const r = await fetch("/api/data?op=feedback-delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || "Fehler");
    await loadFeedback(); toast("Gelöscht.");
  } catch (e) { toast("Löschen fehlgeschlagen: " + e.message); }
}

function render() {
  const f = captureFocus();
  if (MODE === "erfassen") { renderCyclebar(); renderErfassen(); }
  else if (MODE === "fazit") { renderCyclebar(); renderFazit(); }
  else { renderVernehmlassung(); }
  restoreFocus(f);
}

(async function init() {
  $("#app").innerHTML = '<div class="loading">Lädt…</div>';
  await loadData();
  render();
})();

</script>
</body>
</html>
